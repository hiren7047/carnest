# Carnest — PostgreSQL local stack (matches production carnest_db)
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: carnest-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: carnest
      POSTGRES_PASSWORD: carnest_local
      POSTGRES_DB: carnest_db
      TZ: Asia/Kolkata
    volumes:
      - carnest_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnest -d carnest_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  carnest_pg_data:
